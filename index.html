<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>중1 과학 1-2 5단원 힘의 작용 퀴즈 118제 + OX 100제</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root{
  --p1:#6c5ce7; --p1-dark:#4834b0; --p2:#f0a500; --p2-dark:#b97a00;
  --bg1:#0f0c29; --bg2:#302b63; --bg3:#24243e;
  --card:#ffffff; --ink:#211d3a; --sub:#7a76a3;
  --good:#2e8b57; --warn:#d9822b; --gold:#d4a017; --line:#e6e3f5;
}
*{box-sizing:border-box;}
body{margin:0;font-family:'Noto Sans KR',sans-serif;color:var(--ink);
  background:linear-gradient(160deg,var(--bg1) 0%, var(--bg2) 55%, var(--bg3) 100%);
  min-height:100vh;padding-bottom:40px;}
.wrap{max-width:640px;margin:0 auto;padding:18px 16px 60px;}
.hero{text-align:center;padding:18px 10px 6px;}
.hero .eyebrow{font-size:13px;color:#c9c4ff;font-weight:700;letter-spacing:.5px;}
.hero h1{font-family:Georgia,'Nanum Myeongjo','Batang',serif;font-size:30px;margin:4px 0 6px;
  background:linear-gradient(90deg,#a78bfa,var(--p2));-webkit-background-clip:text;background-clip:text;color:transparent;}
.hero p{font-size:13px;color:#c9c4ff;margin:0 0 14px;}
.gauge{height:10px;border-radius:6px;background:linear-gradient(90deg,var(--p2),#c8b7a6,var(--p1),#3fae6a);position:relative;margin-bottom:4px;}
.gauge .mark{position:absolute;top:-4px;width:3px;height:18px;background:#2b2320;border-radius:2px;}
.gauge-labels{display:flex;justify-content:space-between;font-size:11px;color:var(--sub);margin-bottom:16px;}
.card{background:var(--card);border-radius:22px;box-shadow:0 10px 30px rgba(20,10,50,.35);padding:22px 20px;margin-bottom:16px;}
h2.card-title{font-family:Georgia,'Nanum Myeongjo','Batang',serif;font-size:22px;margin:0 0 14px;color:var(--p1-dark);}
label.field-label{display:block;font-size:14px;font-weight:700;margin:14px 0 6px;color:var(--ink);}
input[type=text]{width:100%;padding:14px;border-radius:14px;border:1.5px solid #ddd6f5;font-size:16px;background:#faf9ff;}
input[type=text]:focus{outline:2px solid var(--p1);}
.chip-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:6px;}
.chip{border:1.5px solid #ddd6f5;border-radius:14px;padding:12px;text-align:center;cursor:pointer;background:#faf9ff;transition:.15s;}
.chip b{display:block;font-size:13px;}
.chip small{color:var(--sub);font-size:11px;}
.chip.active{border-color:var(--p1);background:#efeaff;box-shadow:0 0 0 2px rgba(108,92,231,.15) inset;}
.toggle-row{display:flex;align-items:center;gap:8px;margin:12px 0;font-size:14px;}
.toggle-row input{width:18px;height:18px;}
.mode-card{border:1.5px solid #ddd6f5;border-radius:16px;padding:14px 16px;margin-bottom:10px;cursor:pointer;background:#faf9ff;}
.mode-card.active{border-color:var(--p1);background:#efeaff;box-shadow:0 0 0 2px rgba(108,92,231,.15) inset;}
.mode-card .mt{font-weight:700;font-size:15px;}
.mode-card .md{font-size:12px;color:var(--sub);margin-top:2px;}
.resume-box{background:linear-gradient(90deg,#ffe9b3,#ffd88a);border-radius:16px;padding:16px;margin-bottom:16px;}
.resume-box b{display:block;font-size:15px;margin-bottom:6px;color:#6b4c00;}
.pw-change-box{background:#eaf2fb;border-radius:16px;padding:16px;margin-bottom:16px;}
.pw-change-box b{display:block;font-size:15px;margin-bottom:2px;color:#1a4a7a;}
.pw-change-box .row2{gap:8px;}
.pw-change-box input{flex:1;}
.btn{display:block;width:100%;text-align:center;padding:16px;border-radius:16px;font-weight:800;font-size:16px;border:none;cursor:pointer;text-decoration:none;box-sizing:border-box;}
.btn-primary{background:linear-gradient(90deg,var(--p1),var(--p1-dark));color:#fff;box-shadow:0 8px 18px rgba(108,92,231,.35);}
.btn-outline{background:#fff;border:1.6px solid var(--p1);color:var(--p1-dark);}
.btn-ghost{background:#f1eefc;color:var(--ink);}
.row2{display:flex;gap:10px;margin-top:10px;}
.row2 .btn{flex:1;}
.small-note{font-size:12px;color:var(--sub);text-align:center;margin-top:10px;}
.tag{display:inline-block;background:#efeaff;color:var(--p1-dark);font-weight:700;font-size:13px;padding:6px 12px;border-radius:20px;margin-bottom:10px;}
.meta-row{display:flex;justify-content:space-between;font-size:13px;color:var(--sub);margin-bottom:8px;}
.timerbar-outer{height:8px;background:#ece8fa;border-radius:5px;overflow:hidden;margin-bottom:14px;}
.timerbar-inner{height:100%;background:linear-gradient(90deg,var(--p1),var(--p2));transition:width 1s linear;}
.combo-badge{display:inline-block;background:linear-gradient(90deg,#ff7a59,#ff4d4d);color:#fff;font-weight:800;font-size:13px;padding:6px 14px;border-radius:20px;margin-bottom:10px;box-shadow:0 4px 10px rgba(255,77,77,.35);animation:comboPop .25s ease;}
@keyframes comboPop{0%{transform:scale(.7);opacity:0;}100%{transform:scale(1);opacity:1;}}
.qtext{font-size:19px;font-weight:700;line-height:1.5;margin:8px 0 14px;}
.qimg{width:100%;border-radius:14px;margin-bottom:14px;border:1px solid var(--line);display:block;}
.choice{border:1.6px solid #ddd6f5;border-radius:16px;padding:16px;margin-bottom:10px;font-size:15px;cursor:pointer;background:#faf9ff;}
.block-slots{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:14px 0;}
.block-slot{width:44px;height:52px;border:2px solid #ddd6f5;border-radius:10px;background:#faf9ff;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:800;color:var(--p1-dark);}
.block-slot.filled{border-color:var(--p1);background:#efeaff;}
.block-slot.correct{border-color:#4caf50;background:#e8f7ea;color:#2e7d32;}
.block-slot.wrong{border-color:#e57373;background:#fdecea;color:#c62828;}
.block-tiles{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:10px;}
.block-tile{width:42px;height:42px;border-radius:10px;background:#fff;border:1.6px solid #ddd6f5;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:700;cursor:pointer;}
.block-tile.used{opacity:0.25;pointer-events:none;}
.block-tile.locked{opacity:0.5;pointer-events:none;}
/* 주기율표 전체 채우기(pfull) 문제용 */
.pt-grid{display:grid;gap:3px;margin:14px 0;overflow-x:auto;}
.pt-cell{aspect-ratio:1;min-width:22px;display:flex;align-items:center;justify-content:center;border-radius:5px;background:#EAF1FB;color:#5b3fae;font-size:10.5px;font-weight:700;}
.pt-cell.empty{background:transparent;}
.pt-cell.filled{background:#d8f3e6;color:#1F6B4E;}
.pt-progress{text-align:center;font-size:15px;font-weight:700;color:#5b3fae;margin-bottom:8px;}
.pt-tile{width:42px;height:42px;border-radius:10px;background:#fff;border:1.6px solid #ddd6f5;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700;cursor:pointer;}
.pt-tile.used{opacity:0.25;pointer-events:none;}
.pt-tile.shake{animation:shake-tile-pf .32s ease-in-out;}
@keyframes shake-tile-pf{0%,100%{transform:translateX(0);}25%{transform:translateX(-4px);}75%{transform:translateX(4px);}}
.choice.sel{border-color:var(--p2);background:#fff3de;}
.choice.correct{border-color:var(--good);background:#e7f6ec;}
.choice.wrong{border-color:#c0392b;background:#fdeceb;}
.choice.locked{background:#e3e6df;border-color:#c7cdc0;color:#15190f;cursor:not-allowed;}
.lock-note{font-size:12px;font-weight:700;margin-top:2px;}
.lock-countdown{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;background:#f6f4ee;border:3px dashed #d8cfa8;border-radius:18px;padding:10px 14px 14px;margin:4px 0 14px;font-weight:800;color:#a8631a;font-size:14px;transition:.2s;}
.lock-countdown .num{font-size:64px;font-weight:900;font-family:Georgia,'Nanum Myeongjo','Batang',serif;color:var(--p2-dark);min-width:60px;text-align:center;line-height:1;}
.lock-countdown .go-emoji{font-size:44px;line-height:1;}
.lock-countdown.go{color:var(--p1-dark);border-color:var(--p1);background:#efeaff;border-style:solid;}
.scope-row{display:flex;gap:8px;margin:6px 0 2px;}
.scope-chip{flex:1;border:1.5px solid #ddd6f5;border-radius:12px;padding:9px 6px;text-align:center;font-size:12.5px;font-weight:700;cursor:pointer;background:#faf9ff;color:var(--sub);}
.scope-chip.active{border-color:var(--p1);background:#efeaff;color:var(--p1-dark);}
.hist-item{border:1.5px solid var(--line);border-radius:16px;padding:14px 16px;margin-bottom:10px;cursor:pointer;background:#faf9ff;}
.hist-item:active{background:#f1eefc;}
.hist-top{display:flex;justify-content:space-between;align-items:center;font-weight:700;font-size:14px;}
.hist-sub{font-size:12px;color:var(--sub);margin-top:4px;}
.explain-box{background:#fdeceb;border-radius:14px;padding:14px 16px;font-size:14px;line-height:1.6;margin:10px 0 16px;}
.explain-box.right{background:#e7f6ec;}
.explain-box b{display:block;margin-bottom:6px;font-size:15px;}
.giveup{display:block;text-align:center;color:var(--sub);font-size:13px;margin-top:14px;text-decoration:underline;cursor:pointer;}
.score-big{text-align:center;font-family:Georgia,'Nanum Myeongjo','Batang',serif;font-size:54px;font-weight:700;color:var(--p1-dark);margin:6px 0 2px;}
.score-sub{text-align:center;color:var(--sub);font-size:14px;margin-bottom:14px;}
.fanfare{text-align:center;font-weight:900;font-size:19px;border-radius:16px;padding:16px;margin:14px 0;}
.fanfare.f80{background:#fdf2e3;color:#a8631a;}
.fanfare.f90{background:#efeaff;color:var(--p1-dark);}
.fanfare.f95{background:#eaf2fb;color:#2266aa;}
.fanfare.f100{background:linear-gradient(135deg,#ffe27a,#ffb648);color:#6b3d00;}
table{width:100%;border-collapse:collapse;font-size:13px;}
th,td{padding:8px 6px;text-align:center;border-bottom:1px solid var(--line);}
th{color:var(--sub);font-weight:700;background:#f7f5ff;}
.tabbar{display:flex;gap:4px;border-bottom:2px solid var(--line);margin-bottom:14px;overflow-x:auto;}
.tabbtn{flex:1;text-align:center;padding:10px 4px;font-size:13px;font-weight:700;color:var(--sub);cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap;}
.tabbtn.active{color:var(--p1-dark);border-color:var(--p1);}
.warnbox{background:#fdf2e3;border-radius:12px;padding:12px 14px;font-size:12.5px;color:#7a5a1a;margin-bottom:14px;}
.hidden{display:none !important;}
.modal-overlay{position:fixed;inset:0;background:rgba(15,10,30,.6);display:flex;align-items:center;justify-content:center;z-index:1200;padding:24px;}
.modal-overlay.hidden{display:none !important;}
.modal-box{background:#fff;border-radius:20px;padding:24px 20px;max-width:340px;width:100%;box-shadow:0 24px 60px rgba(0,0,0,.3);}
.modal-box p{font-size:15px;line-height:1.6;margin:0 0 18px;text-align:center;color:var(--ink);white-space:pre-line;}
.spinner{display:inline-block;width:32px;height:32px;border:4px solid #e6e0f7;border-top-color:var(--p1);border-radius:50%;animation:spin .8s linear infinite;margin-bottom:10px;}
@keyframes spin{to{transform:rotate(360deg);}}
.footer-copy{text-align:center;color:#9d97c9;font-size:12px;margin-top:20px;}
.kbdinput{width:100%;padding:14px;border-radius:14px;border:1.6px solid var(--p1);font-size:16px;margin-bottom:14px;background:#eaf2fb;}
.wrongitem{border:1.5px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px;}
.wrongitem .wq{font-weight:700;margin-bottom:6px;}
.wrongitem .wa{color:var(--good);font-weight:700;font-size:13px;}
.wrongitem .wu{color:#c0392b;font-size:13px;}
.stu-row{display:flex;justify-content:space-between;align-items:center;padding:12px 8px;border-bottom:1px solid var(--line);cursor:pointer;}
.stu-row:active{background:#f7f5ff;}
.stu-name{font-weight:700;font-size:15px;}
.stu-meta{font-size:12px;color:var(--sub);margin-top:2px;}
.stu-score{font-weight:800;color:var(--p1-dark);font-size:15px;}
@media print{
  body *{visibility:hidden;}
  #printArea, #printArea *{visibility:visible;}
  #printArea{position:absolute;left:0;top:0;width:100%;}
}
</style>
</head>

/* ============ APP CONFIG ============ */
const APP_KEY='g1_2_u5_force';      // 이 앱 전용 로컬 저장 키
const APP_ID='g1_2_u5_force';       // 구글 시트에 기록될 앱 구분자
const TEACHER_PW='0000';
const DEFAULT_STUDENT_PW='1234'; // 학생 로그인 기본 비밀번호(강사가 강사용 화면에서 바꿀 수 있어요)
const GAS_URL='https://script.google.com/macros/s/AKfycbwSAZENNZJ4Y0Vy_wiRRFwv8V13tstEsr5uiTa_VO1KBDXre1D2aBentjviBecP9fsRxQ/exec';  // 이미 배포된 공용 Apps Script 백엔드 (여러 단원 앱이 공유, APP_ID로 구분됨)

function uid(){return 'x'+Date.now().toString(36)+Math.random().toString(36).slice(2,8);}
function safeName(n){return (n||'').replace(/[^a-zA-Z0-9가-힣]/g,'');}
function wait(ms){return new Promise(r=>setTimeout(r,ms));}

/* ============ 학생 로그인 설정(비밀번호 · 로그인 사용 여부) ============
   구글 시트(Settings 탭)에 강사가 바꾼 값이 저장돼요. 기기가 온라인이면 앱을 열 때마다 최신
   값을 가져오고, 이 기기에도 캐시해 둬서(다음 접속 시 오프라인이어도 동작) 실패하면 캐시된 값
   → 그마저 없으면 기본값(비밀번호 1234, 로그인 사용함) 순서로 사용해요. */
function cachedStudentPwKey(){ return 'studentpw_'+APP_KEY; }
function cachedLoginEnabledKey(){ return 'loginenabled_'+APP_KEY; }
let loginConfigCache=null; // 앱 켤 때 한 번만 서버에서 받아오고, 이후에는 이 값을 재사용해요.
async function getLoginConfig(){
  if(loginConfigCache) return loginConfigCache;
  let password=DEFAULT_STUDENT_PW, loginEnabled=true;
  if(GAS_URL){
    try{
      const res=await fetch(GAS_URL+'?action=getPassword&app='+encodeURIComponent(APP_ID));
      const j=await res.json();
      if(j && j.ok){
        if(j.password){ password=j.password; try{ localStorage.setItem(cachedStudentPwKey(), password); }catch(e){} }
        if(typeof j.loginEnabled==='boolean'){ loginEnabled=j.loginEnabled; try{ localStorage.setItem(cachedLoginEnabledKey(), loginEnabled?'Y':'N'); }catch(e){} }
        loginConfigCache={password,loginEnabled};
        return loginConfigCache;
      }
    }catch(e){ /* 네트워크 실패 시 아래 캐시/기본값으로 대체 */ }
  }
  try{
    const cachedPw=localStorage.getItem(cachedStudentPwKey());
    if(cachedPw) password=cachedPw;
    const cachedLE=localStorage.getItem(cachedLoginEnabledKey());
    if(cachedLE) loginEnabled=(cachedLE==='Y');
  }catch(e){}
  loginConfigCache={password,loginEnabled};
  return loginConfigCache;
}
async function getStudentPassword(){ const c=await getLoginConfig(); return c.password; }

function newSession(){
  return {name:localStorage.getItem('lastname_'+APP_KEY)||'',cats:[],order:'seq',mode:'full',wrongScope:'all',randomCount:0,
    list:[],idx:0,correct:0,answers:{},wrong:[],combo:0,maxCombo:0,
    setSize:20,setIdx:0,selected:null,blockPicks:[],pfProgress:0,pfUsed:[],pfMistakes:0,submitted:false,giveUp:false,
    lockUntil:0,lockTimerId:null,gsSessionId:null,timeLeft:60,timerId:null};
}
let state=newSession();

/* ============ LOCAL STORAGE (내 기기 임시 저장 · 이어풀기용) ============ */
function sset(key,val){
  try{ localStorage.setItem(key,JSON.stringify(val)); return true; }catch(e){ return false; }
}
function sget(key){
  try{ const v=localStorage.getItem(key); return v?JSON.parse(v):null; }catch(e){ return null; }
}

/* ---- 이어풀기(resume): 같은 기기에서 풀다 만 시험을 이어서 풀 수 있도록 진행 상황을 저장 ----
   일반 모드(전체/집중력/꼼꼼정독)와 오답모드는 저장 슬롯을 서로 분리해요. 그래야 학생이 풀던
   시험을 마치기 전에 오답모드를 새로 시작해도, 원래 풀던 시험의 이어풀기 기록이 사라지지
   않고 그대로 남아있어요(반대 경우도 마찬가지). */
function resumeGroup(mode){ return mode==='wrong' ? 'wrong' : 'normal'; }
function resumeKey(name, mode){ return 'resume_'+APP_KEY+'_'+safeName(name)+'_'+resumeGroup(mode); }
function buildResumeSnapshot(){
  return {
    name:state.name, cats:state.cats, order:state.order, mode:state.mode, wrongScope:state.wrongScope,
    list:state.list.map(q=>q._id), idx:state.idx, correct:state.correct, answers:state.answers,
    wrong:state.wrong, setIdx:state.setIdx, gsSessionId:state.gsSessionId,
    combo:state.combo||0, maxCombo:state.maxCombo||0, ts:Date.now()
  };
}
function saveResumeSnapshot(){
  if(!state.name) return;
  sset(resumeKey(state.name, state.mode), buildResumeSnapshot());
  // 서버(구글 시트)에도 함께 올려서, 다른 기기에서 같은 이름으로 로그인해도 이어풀기가 되도록 해요.
  sendProgressToSheet(false);
}
function loadResumeSnapshot(name, mode){
  return sget(resumeKey(name, mode));
}
function clearResumeSnapshot(name, mode){
  try{ localStorage.removeItem(resumeKey(name||state.name, mode!==undefined?mode:state.mode)); }catch(e){}
}
/* 이 기기(localStorage)와 서버(구글 시트, 다른 기기에서 남긴 기록) 중 더 최근 것을 고른다. */
function pickNewerSnapshot(a,b){
  if(a && b) return (b.ts||0)>(a.ts||0) ? b : a;
  return a || b || null;
}
/* 로그인 직후 한 번 호출해서, 이 학생 이름으로 다른 기기에 남아있는 미완료 시험을 가져온다.
   구글 시트 Log에는 문제를 하나 풀 때마다(완료 전에도) resume 스냅샷이 함께 저장되어 있다. */
async function fetchServerResumeSnapshots(name){
  const empty={normal:null,wrong:null};
  if(!GAS_URL || !name) return empty;
  try{
    const res=await fetch(GAS_URL+'?action=student&app='+encodeURIComponent(APP_ID)+'&name='+encodeURIComponent(name));
    const data=await res.json();
    if(!data.ok || !Array.isArray(data.sessions)) return empty;
    const byGroup={normal:null,wrong:null};
    data.sessions.forEach(s=>{
      if(s.finished) return;
      const r=s.resume;
      if(!r || !r.list || !r.list.length) return;
      const g=resumeGroup(r.mode);
      if(!byGroup[g] || (r.ts||0)>(byGroup[g].ts||0)) byGroup[g]=r;
    });
    return byGroup;
  }catch(e){ return empty; }
}
let serverResumeCache={normal:null,wrong:null};
function resumeFromSnapshot(snap){
  const list=snap.list.map(id=>questionById(id)).filter(Boolean);
  if(list.length===0){ clearResumeSnapshot(snap.name, snap.mode); showAlert('이어풀기 기록을 불러올 수 없어요. 처음부터 다시 시작해 주세요.'); return; }
  state=newSession();
  state.name=snap.name; state.cats=snap.cats||[]; state.order=snap.order||'seq'; state.mode=snap.mode||'full';
  state.wrongScope=snap.wrongScope||'all';
  state.list=list; state.idx=Math.min(snap.idx,list.length); state.correct=snap.correct||0;
  state.answers=snap.answers||{}; state.wrong=snap.wrong||[]; state.setIdx=snap.setIdx||0;
  state.combo=snap.combo||0; state.maxCombo=snap.maxCombo||0;
  state.gsSessionId=snap.gsSessionId||uid();
  state.selected=null; state.blockPicks=[]; state.pfProgress=0; state.pfUsed=[]; state.pfMistakes=0; state.submitted=false;
  screen='quiz'; render(); startTimerForCurrent();
}

/* ============ 구글 시트 실시간 전송 ============
   - 문제를 하나 제출할 때마다(전체를 다 풀지 않아도) 지금까지의 누적 상태를 구글 시트로 보내요.
     같은 sessionId로 여러 번 보내면 Apps Script 쪽에서 그 줄을 덮어써서(갱신), 이 학생의 이번
     회차당 딱 한 줄만 남고 계속 최신 상태로 갱신돼요.
   - Apps Script 웹앱은 브라우저의 사전 확인(preflight) 요청을 처리하지 못하므로, 반드시
     mode:'no-cors' + Content-Type: text/plain 조합으로 보내야 조용히 막히지 않고 전송돼요. */
function sendProgressToSheet(finished){
  if(!GAS_URL) return;
  try{
    const payload={
      app: APP_ID, sessionId: state.gsSessionId, name: state.name, ts: Date.now(),
      mode: state.mode, cats: state.cats.length?state.cats.map(catName).join(','):'전체',
      answered: Object.keys(state.answers).length, total: state.list.length,
      correct: state.correct,
      score: Object.keys(state.answers).length>0?Math.round(state.correct/Object.keys(state.answers).length*100):0,
      finished: !!finished,
      wrong: state.wrong.map(w=>({id:w.id,q:w.q,your:w.your,correct:w.correct})),
      answers: state.answers, /* {문제id: true/false} 전체 맵. 다른 기기에서 나중에 같은 문제를
        맞혔는지까지 정확히 반영해 누적 오답을 계산하려면 '틀린 것'만이 아니라 '맞힌 것'까지도
        알아야 해서 함께 보내요. */
      resume: finished ? null : buildResumeSnapshot() /* 완료되지 않은 시험만 이어풀기용 스냅샷을
        함께 보내요. 다른 기기에서 같은 이름으로 로그인하면 이 스냅샷을 받아와 이어풀기를
        보여줄 수 있어요. */
    };
    fetch(GAS_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain'},body:JSON.stringify(payload)});
  }catch(e){ /* 전송 실패가 퀴즈 진행을 막으면 안 되므로 조용히 무시 */ }
}

/* 특정 학생의 시험 기록을 구글 시트에서 조회 (다른 기기에서 풀었어도 누적 오답 모드가 동작하도록) */
async function fetchStudentSessions(name){
  if(!GAS_URL) return {ok:false, sessions:null};
  try{
    const res=await fetch(GAS_URL+'?action=student&app='+encodeURIComponent(APP_ID)+'&name='+encodeURIComponent(name));
    const j=await res.json();
    if(j && j.ok) return {ok:true, sessions:j.sessions||[]};
    return {ok:false, sessions:null};
  }catch(e){ return {ok:false, sessions:null}; }
}

/* ============ HELPERS ============ */
function shuffle(arr){const a=arr.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function pickByCats(cats){ if(!cats||cats.length===0) return QUESTIONS.slice(); return QUESTIONS.filter(q=>cats.includes(q.c)); }
function catName(id){const c=CATS.find(x=>x.id===id);return c?c.name:id;}

/* ============ 정답 위치(①~④) 자동 셔플 ============
   문제를 아무리 균형 있게 작성해도 정답이 특정 번호(특히 ①)에 몰리는 실수가 생기기 쉬우므로,
   로드 시 한 번, 문제 텍스트 해시를 시드로 각 문제의 보기 순서를 결정적으로 섞는다.
   같은 문제는 항상 같은 순서로 섞이므로(새로고침해도 보기 순서가 안 바뀜), 학생이 오답 노트에서
   같은 문제를 다시 볼 때도 보기 순서가 유지된다. 절대 지우지 말 것 — 이 안전망이 없으면
   손으로 정답 위치를 맞춰야 하는데, 실제로 정답의 65%가 ①에 몰렸던 사례가 있었다. */
function hashStr(str){
  let h=0;
  for(let i=0;i<str.length;i++){ h=(Math.imul(31,h)+str.charCodeAt(i))|0; }
  return h>>>0;
}
function seededShuffleIdx(seed,n){
  const arr=Array.from({length:n},(_,i)=>i);
  let s=seed||1;
  function rand(){ s=(s*1103515245+12345)&0x7fffffff; return s/0x7fffffff; }
  for(let i=n-1;i>0;i--){ const j=Math.floor(rand()*(i+1)); [arr[i],arr[j]]=[arr[j],arr[i]]; }
  return arr;
}
QUESTIONS.forEach(q=>{
  if(q.t==='mcq' && Array.isArray(q.o) && q.o.length>2){
    const perm=seededShuffleIdx(hashStr(q.q),q.o.length); // perm[새 위치]=원래 위치
    q.o=perm.map(origIdx=>q.o[origIdx]);
    q.a=perm.indexOf(q.a);
  }
});

/* 문제에 고유 id를 부여. M(...)의 마지막 인자로 이미 고정 id가 박혀 있으면(항상 그래야 함 —
   질문 작성 단계 참고) 그걸 그대로 써서, 나중에 문제 문구를 고치거나 배열 순서를 바꾸거나
   문제를 추가/삭제해도 id가 절대 안 바뀌게 해요. 이래야 오답모드·이어풀기가 나중에 이 앱을
   다시 수정해도 계속 정확히 동작해요(배열 인덱스로 id를 매기면 인덱스가 바뀌는 순간 예전
   기록과의 연결이 끊어짐 — 실제로 이 문제 때문에 다른 앱에서 오답모드가 고장 난 사례가 있었음).
   혹시 id 없이 작성된 문제가 있으면 그때만 배열 위치 기반 임시 id를 부여해요. */
QUESTIONS.forEach((q,i)=>{ q._id = q.id || ('q'+i); });
function questionById(id){return QUESTIONS.find(q=>q._id===id);}

function fmtDate(ts){const d=new Date(ts);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function fmtDT(ts){const d=new Date(ts);return fmtDate(ts)+' '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');}
function modeLabel(m){return {full:'전체문제',focus:'집중력 향상',deep:'꼼꼼 정독',wrong:'오답모드'}[m]||m;}

/* ============ MODAL ============ */
function showAlert(msg){
  return new Promise(resolve=>{
    const ov=document.getElementById('modalOverlay');
    document.getElementById('modalMsg').textContent=msg;
    document.getElementById('modalBtns').innerHTML=`<button class="btn btn-primary" id="modalOkBtn">확인</button>`;
    ov.classList.remove('hidden');
    document.getElementById('modalOkBtn').onclick=()=>{ov.classList.add('hidden');resolve(true);};
  });
}
function showConfirm(msg){
  return new Promise(resolve=>{
    const ov=document.getElementById('modalOverlay');
    document.getElementById('modalMsg').textContent=msg;
    document.getElementById('modalBtns').innerHTML=`<button class="btn btn-ghost" id="modalCancelBtn">취소</button><button class="btn btn-primary" id="modalOkBtn">확인</button>`;
    ov.classList.remove('hidden');
    document.getElementById('modalOkBtn').onclick=()=>{ov.classList.add('hidden');resolve(true);};
    document.getElementById('modalCancelBtn').onclick=()=>{ov.classList.add('hidden');resolve(false);};
  });
}
/* 옵션이 3개 이상인 선택창(예: 그만풀기 눌렀을 때 저장/채점/계속풀기 중 고르기).
   options: [{key:'save', label:'...', primary:true}, ...] 순서대로 세로로 쌓아서 보여준다. */
function showChoice(msg, options){
  return new Promise(resolve=>{
    const ov=document.getElementById('modalOverlay');
    document.getElementById('modalMsg').textContent=msg;
    document.getElementById('modalBtns').innerHTML=options.map((o,i)=>
      `<button class="btn ${o.primary?'btn-primary':'btn-outline'}" style="margin-top:${i===0?'0':'8px'};" id="modalChoice${i}">${o.label}</button>`
    ).join('');
    document.getElementById('modalBtns').style.flexDirection='column';
    ov.classList.remove('hidden');
    options.forEach((o,i)=>{
      document.getElementById('modalChoice'+i).onclick=()=>{
        ov.classList.add('hidden');
        document.getElementById('modalBtns').style.flexDirection='';
        resolve(o.key);
      };
    });
  });
}
function showLoading(msg){
  const ov=document.getElementById('modalOverlay');
  document.getElementById('modalMsg').innerHTML=`<span class="spinner"></span><br>${msg}`;
  document.getElementById('modalBtns').innerHTML='';
  ov.classList.remove('hidden');
}
function hideLoading(){document.getElementById('modalOverlay').classList.add('hidden');}

async function attemptLogin(){
  const nameEl=document.getElementById('loginNameInput');
  const pwEl=document.getElementById('loginPwInput'); // 로그인 기능이 꺼져 있으면 화면에 없을 수 있어요.
  const nm=(nameEl?nameEl.value:'').trim();
  if(!nm){showAlert('이름을 입력해 주세요!');return;}
  if(!safeName(nm)){showAlert('이름에 특수문자나 공백만 있으면 기록이 저장되지 않아요. 다른 이름으로 입력해 주세요!');return;}
  const cfg=await getLoginConfig();
  if(cfg.loginEnabled!==false){
    const pw=(pwEl?pwEl.value:'').trim();
    if(!pw){showAlert('비밀번호를 입력해 주세요!');return;}
    showLoading('확인하고 있어요...');
    hideLoading();
    if(pw!==cfg.password){showAlert('비밀번호가 틀렸어요. 선생님께 다시 확인해 주세요!');return;}
  }
  state.name=nm;

  showLoading('이전 기록을 확인하고 있어요...');
  serverResumeCache=await fetchServerResumeSnapshots(nm);
  hideLoading();
  screen='setup';render();
}

function startQuiz(mode){
  if(!state.name){showAlert('이름을 입력해 주세요!');return;}
  localStorage.setItem('lastname_'+APP_KEY, state.name);
  state.mode=mode||state.mode;
  const pool=pickByCats(state.cats);
  let list;
  if(state.mode==='wrong'){
    loadWrongPoolAndStart();
    return;
  } else {
    list=state.order==='shuffle'?shuffle(pool):pool.slice();
    // 랜덤 문제 수를 정해서 풀기로 했으면, 고른 범위의 실제 문제 수를 넘지 않도록 잘라내요.
    if(state.randomCount>0){
      const n=Math.min(state.randomCount, pool.length);
      list=shuffle(pool).slice(0,n);
    }
  }
  beginList(list);
}

/* ============ 이 기기에 저장되는 학생별 오답 기록 (이름으로 구분됨) ============
   구글 시트 연동이 안 되어 있거나 실패했을 때 대신 사용해요. 반드시 '이름'을 키로 저장/조회하므로
   같은 기기를 여러 학생이 번갈아 써도(새로고침 없이) 서로 다른 학생의 오답이 섞이지 않아요. */
function localDataKey(name){ return 'localdata_'+APP_KEY+'_'+safeName(name); }
function getLocalStudentData(name){
  const d=sget(localDataKey(name));
  return d || {examLogs:[], wrong:[]};
}
function saveLocalExamLog(){
  if(!state.name) return;
  const d=getLocalStudentData(state.name);
  d.examLogs.push({id:state.gsSessionId, ts:Date.now(), mode:state.mode, wrongList:state.wrong.map(w=>({id:w.id,your:w.your}))});
  if(d.examLogs.length>50) d.examLogs=d.examLogs.slice(d.examLogs.length-50);
  // 누적 오답 갱신: 이번 시험에서 맞은 문제는 누적 오답에서 제거, 틀린 문제는 추가/갱신
  state.wrong.forEach(w=>{
    const exist=d.wrong.find(x=>x.id===w.id);
    if(exist) exist.your=w.your; else d.wrong.push({id:w.id,your:w.your});
  });
  Object.keys(state.answers).forEach(qid=>{
    if(state.answers[qid]===true) d.wrong=d.wrong.filter(w=>w.id!==qid);
  });
  sset(localDataKey(state.name), d);
}

/* 오답 모드: 구글 시트에 기록된 이 학생의 시험 기록을 우선 사용(다른 기기에서 풀었어도 반영),
   시트 연동이 안 되어 있거나 실패하면 '이 이름으로' 이 기기에 저장된 기록으로 대체 */
async function loadWrongPoolAndStart(){
  showLoading('오답 기록을 불러오고 있어요...');
  const {ok, sessions}=await fetchStudentSessions(state.name);
  hideLoading();
  let wn=[];
  if(ok && sessions){
    const sorted=sessions.slice().sort((a,b)=>b.ts-a.ts);
    if(state.wrongScope==='recent'){
      if(sorted.length===0){showAlert('아직 제출한 시험 기록이 없어요! 먼저 다른 모드로 시험을 한 번 봐 주세요.');return;}
      wn=sorted[0].wrong||[];
      if(wn.length===0){showAlert('가장 최근 시험에서는 틀린 문제가 없었어요! 완벽했네요 🎉');return;}
    } else {
      // 시간순(오래된 것 → 최신)으로 훑으면서, 같은 문제를 나중에(다른 기기 포함) 맞혔다면
      // 그 문제는 더 이상 오답으로 치지 않도록 정리해요. 이렇게 해야 '원래 기기에서 틀렸다가
      // 이 기기에서 맞힌 문제'가 누적 오답에 계속 남아있는 일이 없어요.
      const byTimeAsc=sorted.slice().sort((a,b)=>a.ts-b.ts);
      const wrongMap={};
      byTimeAsc.forEach(s=>{
        const wrongIds=new Set((s.wrong||[]).map(w=>w.id));
        (s.wrong||[]).forEach(w=>{ wrongMap[w.id]=w; });
        const answers=s.answers||{};
        Object.keys(answers).forEach(qid=>{
          if(answers[qid]===true && !wrongIds.has(qid)) delete wrongMap[qid];
        });
      });
      wn=Object.values(wrongMap);
      if(wn.length===0){
        if(sorted.length===0) showAlert('아직 본 시험이 없어요! 먼저 다른 모드로 시험을 한 번 봐 주세요.');
        else showAlert('지금까지 틀렸던 문제를 모두 맞혔어요! 완벽해요 🎉');
        return;
      }
    }
  } else {
    // 시트 연동이 안 되어 있으면 '지금 입력한 이름'으로 이 기기에 저장된 기록만 사용
    // (다른 학생이 방금 전에 이 기기에서 풀었더라도 섞이지 않아요)
    const d=getLocalStudentData(state.name);
    const logs=d.examLogs.slice().sort((a,b)=>b.ts-a.ts);
    if(state.wrongScope==='recent'){
      if(logs.length===0){
        showAlert(GAS_URL?'아직 이 이름으로 제출한 시험 기록이 없어요! 먼저 다른 모드로 시험을 한 번 봐 주세요.':'⚠️ 구글 시트 연동 주소(GAS_URL)가 설정되지 않아 이 기기에서 이 이름으로 남긴 기록만 사용해요. 아직 기록이 없어요!');
        return;
      }
      wn=logs[0].wrongList||[];
      if(wn.length===0){showAlert('가장 최근 시험에서는 틀린 문제가 없었어요! 완벽했네요 🎉');return;}
    } else {
      wn=d.wrong.slice();
      if(wn.length===0){
        showAlert(GAS_URL?(logs.length===0?'아직 이 이름으로 제출한 시험 기록이 없어요! 먼저 다른 모드로 시험을 한 번 봐 주세요.':'지금까지 틀렸던 문제를 모두 맞혔어요! 완벽해요 🎉'):'⚠️ 구글 시트 연동 주소(GAS_URL)가 설정되지 않아 이 기기에서 이 이름으로 남긴 기록만 사용해요. 아직 기록이 없어요!');
        return;
      }
    }
  }
  const ids=[...new Set(wn.map(w=>w.id))];
  let list=QUESTIONS.filter(q=>ids.includes(q._id));
  list=shuffle(list);
  if(list.length===0){showAlert('오답 문제를 찾을 수 없어요. 문제 은행이 갱신되었을 수 있어요.');return;}
  beginList(list);
}

function beginList(list){
  clearResumeSnapshot(state.name);
  state.list=list;
  state.idx=0;state.correct=0;state.wrong=[];state.answers={};
  state.setIdx=0;state.selected=null;state.blockPicks=[];state.pfProgress=0;state.pfUsed=[];state.pfMistakes=0;state.submitted=false;state.giveUp=false;
  state.gsSessionId=uid();
  screen='quiz';
  render();
  startTimerForCurrent();
}

/* ============ QUIZ SCREEN ============ */
function currentQ(){return state.list[state.idx];}

/* 블록 터치형 문제 화면: 정답 글자 수만큼 빈 칸을 보여주고, 아래 흩어진 글자 타일을 순서대로
   눌러서 채우게 한다. state.blockPicks는 q.blocks 배열 안에서 이미 누른 타일의 인덱스를
   누른 순서대로 담은 배열이다. */
function renderBlocksUI(q,isLocked){
  const typed=state.blockPicks.map(i=>q.blocks[i]);
  const answerChars=q.answer.split('');
  const slotsHtml=answerChars.map((ch,i)=>{
    let cls='block-slot';
    const picked=typed[i];
    if(state.submitted){
      if(picked===ch) cls+=' correct';
      else cls+=' wrong';
    } else if(picked!==undefined){
      cls+=' filled';
    }
    return `<div class="${cls}">${picked!==undefined?picked:(state.submitted?ch:'')}</div>`;
  }).join('');
  const tilesHtml=q.blocks.map((letter,i)=>{
    const used=state.blockPicks.includes(i);
    let cls='block-tile';
    if(used) cls+=' used';
    if(isLocked) cls+=' locked';
    return `<div class="${cls}" data-bidx="${i}">${letter}</div>`;
  }).join('');
  return `
    <div class="block-slots">${slotsHtml}</div>
    <div class="block-tiles">${tilesHtml}</div>
    ${!state.submitted?`<div class="giveup" id="blockUndoBtn" style="margin-top:8px;">⌫ 한 글자 지우기</div>`:''}
  `;
}

/* 주기율표 전체 채우기 UI: order 배열 순서대로 팔레트 타일을 눌러서 표를 완성한다.
   state.pfProgress = order 중 몇 개까지 정확히 채웠는지, state.pfUsed = 정답으로 이미
   눌러서 소모된 palette 인덱스 목록. */
function renderPeriodicFullUI(q){
  const gridHtml=q.gridCells.map(sym=>{
    if(sym===null) return `<div class="pt-cell empty"></div>`;
    const placed=q.order.indexOf(sym) < state.pfProgress;
    return `<div class="pt-cell${placed?' filled':''}">${placed?sym:''}</div>`;
  }).join('');
  const paletteHtml=q.palette.map((sym,i)=>{
    const used=state.pfUsed.includes(i);
    return `<div class="pt-tile${used?' used':''}" data-pfidx="${i}">${sym}</div>`;
  }).join('');
  return `
    <div class="pt-progress">${state.pfProgress} / ${q.order.length} 완성</div>
    <div class="pt-grid" style="grid-template-columns:repeat(${q.gridCols},1fr);">${gridHtml}</div>
    <div class="block-tiles">${paletteHtml}</div>
  `;
}

function renderQuiz(){
  const q=currentQ();
  if(!q) return renderResult();
  const total=state.list.length;
  const timePct=Math.max(0,state.timeLeft/60*100);
  const submittedInfo=state.submitted?state.lastResult:null;
  const isLocked=state.mode==='deep' && !state.submitted && Date.now()<state.lockUntil;
  const isBlocks=q.t==='blocks';
  const isPFull=q.t==='pfull';
  const choicesHtml=isPFull ? renderPeriodicFullUI(q) : isBlocks ? renderBlocksUI(q,isLocked) : q.o.map((opt,i)=>{
    let cls='choice';
    if(state.submitted){
      if(i===q.a) cls+=' correct';
      else if(i===state.selected) cls+=' wrong';
    } else if(isLocked){
      cls+=' locked';
    } else if(state.selected===i){
      cls+=' sel';
    }
    return `<div class="${cls}" data-idx="${i}">${q.o.length>2?['①','②','③','④'][i]+' ':''}${opt}</div>`;
  }).join('');
  let feedback='';
  if(state.submitted){
    const ok=submittedInfo.ok;
    feedback=`<div class="explain-box ${ok?'right':''}"><b>${ok?'정답이에요! 🎉':'아쉬워요! 다시 확인해볼까요?'}</b>${q.e}</div>`;
  }
  return `
  <div class="card">
    <div class="tag">${catName(q.c)}</div>
    <div class="meta-row"><span>${state.idx+1} / ${total}</span><span>맞은 개수 ${state.correct}</span></div>
    <div class="meta-row"><span style="font-weight:700;color:var(--p1-dark);">${state.timeLeft}초</span><span></span></div>
    <div class="timerbar-outer"><div class="timerbar-inner" style="width:${timePct}%;"></div></div>
    ${state.mode==='deep' && !state.submitted ? renderLockCountdown(isLocked) : ''}
    ${(state.combo||0)>=2?`<div class="combo-badge">🔥 ${state.combo}연속 정답!</div>`:''}
    <div class="qtext">Q${state.idx+1}. ${q.q}</div>
    ${q.img && IMG[q.img] ? `<img class="qimg" src="${IMG[q.img]}" alt="참고 그림">` : ''}
    <div id="choicesWrap">${choicesHtml}</div>
    ${feedback}
    ${state.submitted?
      `<button class="btn btn-primary" id="nextBtn">${state.idx===total-1?'결과 보기':'다음 문제'}</button>`
      :(isPFull?'':`<button class="btn btn-primary" id="submitBtn">답안 제출</button>`)}
    <div class="giveup" id="giveupBtn">🚪 그만 풀래요</div>
  </div>`;
}

function renderLockCountdown(isLocked){
  const remain=Math.max(1,Math.ceil((state.lockUntil-Date.now())/1000));
  if(isLocked){
    return `<div class="lock-countdown wait" id="lockCountdown"><div class="num">${remain}</div><div>🔒 문제를 꼼꼼히 읽어보세요! (초 후 선택 가능)</div></div>`;
  }
  return `<div class="lock-countdown go" id="lockCountdown"><div class="go-emoji">🔓</div><div>이제 보기를 선택할 수 있어요!</div></div>`;
}
function updateLockUI(){
  if(state.mode!=='deep' || state.submitted) return;
  const el=document.getElementById('lockCountdown');
  if(!el) return;
  const remain=Math.max(0,Math.ceil((state.lockUntil-Date.now())/1000));
  if(remain>0){
    el.className='lock-countdown wait';
    el.innerHTML=`<div class="num">${remain}</div><div>🔒 문제를 꼼꼼히 읽어보세요! (초 후 선택 가능)</div>`;
    document.querySelectorAll('.choice').forEach(c=>c.classList.add('locked'));
  } else {
    el.className='lock-countdown go';
    el.innerHTML=`<div class="go-emoji">🔓</div><div>이제 보기를 선택할 수 있어요!</div>`;
    document.querySelectorAll('.choice').forEach(c=>c.classList.remove('locked'));
  }
}

function startTimerForCurrent(){
  clearInterval(state.timerId);clearInterval(state.lockTimerId);
  state.timeLeft=60;
  if(state.mode==='deep'){
    state.lockUntil=Date.now()+5000;
    updateLockUI();
    state.lockTimerId=setInterval(()=>{
      updateLockUI();
      if(Date.now()>=state.lockUntil){clearInterval(state.lockTimerId);}
    },200);
  }
  state.timerId=setInterval(()=>{
    state.timeLeft--;
    if(state.timeLeft<=0){clearInterval(state.timerId);autoSubmitTimeout();return;}
    const bar=document.querySelector('.timerbar-inner');if(bar)bar.style.width=Math.max(0,state.timeLeft/60*100)+'%';
    const el=document.querySelector('.meta-row span[style]');if(el)el.textContent=state.timeLeft+'초';
  },1000);
}
function autoSubmitTimeout(){ if(!state.submitted){handleSubmit(true);} }

function handleSubmit(timeout){
  clearInterval(state.timerId);
  const q=currentQ();
  let ok=false;
  let yourAnswerText='(제출 안함)';
  let correctAnswerText;
  if(q.t==='blocks'){
    const typed=state.blockPicks.map(i=>q.blocks[i]).join('');
    ok = !timeout && typed===q.answer;
    yourAnswerText = typed || '(제출 안함)';
    correctAnswerText = q.answer;
  } else if(q.t==='pfull'){
    ok = !timeout && state.pfProgress>=q.order.length;
    yourAnswerText = `${state.pfProgress}/${q.order.length}개 완성`+(state.pfMistakes?` (${state.pfMistakes}번 틀림)`:'');
    correctAnswerText = q.order.join(' → ');
  } else {
    if(timeout && state.selected==null){ ok=false; }
    else { ok=state.selected===q.a; }
    yourAnswerText = state.selected!=null?q.o[state.selected]:'(제출 안함)';
    correctAnswerText = q.o[q.a];
  }
  state.submitted=true;
  state.lastResult={ok};
  state.answers[q._id]=ok;
  if(ok){
    state.correct++;
    state.combo=(state.combo||0)+1;
    state.maxCombo=Math.max(state.maxCombo||0,state.combo);
  }
  else {
    state.combo=0;
    state.wrong=state.wrong.filter(w=>w.id!==q._id);
    state.wrong.push({id:q._id,q:q.q,your:yourAnswerText,correct:correctAnswerText,explain:q.e,cat:q.c});
  }
  render();
  saveResumeSnapshot();
}

function goNext(){
  state.idx++;
  state.selected=null;state.blockPicks=[];state.pfProgress=0;state.pfUsed=[];state.pfMistakes=0;state.submitted=false;
  if(state.idx>=state.list.length){ finishQuiz(); return; }
  if(state.mode==='focus' && state.idx>0 && state.idx%state.setSize===0){
    screen='setresult';render();return;
  }
  render();
  startTimerForCurrent();
}

function renderSetResult(){
  const doneInSet=Math.min(state.idx,state.list.length);
  return `
  <div class="card" style="text-align:center;">
    <h2 class="card-title">🎯 세트 완료!</h2>
    <p>지금까지 ${doneInSet}문제 중 ${state.correct}문제를 맞혔어요.</p>
    <button class="btn btn-primary" id="nextSetBtn">다음 세트 시작</button>
    <div class="giveup" id="giveupSetBtn" style="margin-top:12px;">🚪 그만 풀래요</div>
  </div>`;
}

let isFinalizing=false;
function finishQuiz(){
  if(isFinalizing) return; isFinalizing=true;
  clearInterval(state.timerId);clearInterval(state.lockTimerId);
  finalizeAndShowResult(false); isFinalizing=false;
}
function giveUp(){
  if(isFinalizing) return; isFinalizing=true;
  clearInterval(state.timerId);clearInterval(state.lockTimerId);
  finalizeAndShowResult(true); isFinalizing=false;
}
/* '그만 풀래요'를 눌렀을 때 점수를 내지 않고 저장만 해두고 메인 화면으로 나가는 경로.
   saveResumeSnapshot()이 이미 매 문제 제출마다 로컬+서버(구글시트)에 저장해 두므로, 한 번 더
   저장을 확실히 한 뒤 화면만 나간다. 나중에 이 이름으로 다시 들어오면(다른 기기 포함) 이어풀기로
   뜬다. */
function saveForLaterAndExit(){
  saveResumeSnapshot();
  clearInterval(state.timerId);clearInterval(state.lockTimerId);
  screen='setup'; render();
}
/* 그만 풀래요 버튼을 누르면 세 가지 중 하나를 고르게 한다:
   1) 저장하고 나중에 이어풀기, 2) 지금까지 푼 것만 채점하기, 3) 계속 풀래요(취소). */
async function handleGiveUpTap(){
  if(isFinalizing) return;
  const choice=await showChoice('정말 그만 풀까요?',[
    {key:'save', label:'💾 저장하고 나중에 이어풀기', primary:false},
    {key:'grade', label:'📊 지금까지 푼 것만 채점하기', primary:true},
    {key:'continue', label:'▶️ 계속 풀래요', primary:false}
  ]);
  if(choice==='save') saveForLaterAndExit();
  else if(choice==='grade') giveUp();
  // choice==='continue' 또는 그 외: 아무것도 하지 않고 계속 풀던 화면 그대로 둔다.
}
function finalizeAndShowResult(gaveUp){
  state.giveUp=gaveUp;
  const answeredCount=Object.keys(state.answers).length;
  const totalCount=state.list.length;
  const score100 = answeredCount>0 ? Math.round((state.correct/answeredCount)*100) : 0;
  state.finalScore=score100; state.finalAnswered=answeredCount; state.finalTotal=totalCount;
  state.finalPct=totalCount>0?answeredCount/totalCount:0;
  clearResumeSnapshot(state.name);
  saveLocalExamLog();
  sendProgressToSheet(true);
  screen='result';
  render();
}

function fanfareTier(score,pct){
  if(pct<0.6){
    if(score>=90) return {tier:'f90',msg:'잘했어요! 최고예요! 👏 다음엔 모든 문제를 풀면 더 좋아요!'};
    if(score>=80) return {tier:'f80',msg:'고생했어요! 🌱 다음엔 모든 문제를 풀면 더 좋아요!'};
    return null;
  }
  if(score>=100) return {tier:'f100',msg:'🎉🎉 당신은 우주 박사! 존경합니다! 🎉🎉'};
  if(score>=95) return {tier:'f95',msg:'너무너무 잘했어요! 당신은 별과 우주 전문가! ⭐'};
  if(score>=90) return {tier:'f90',msg:'잘했어요! 최고예요! 👏'};
  if(score>=80) return {tier:'f80',msg:'고생했어요! 🌱'};
  return null;
}

function renderResult(){
  const s=state.finalScore,ans=state.finalAnswered,tot=state.finalTotal,pct=state.finalPct;
  const fan=fanfareTier(s,pct);
  const gaugePos=Math.min(100,Math.max(0,s));
  return `
  <div class="card" style="text-align:center;">
    ${state.giveUp?`<div class="warnbox">⚠️ ${tot}문제 중 ${ans}문제만 풀고 제출했어요</div>`:''}
    <div class="score-big">${s}<span style="font-size:22px;">점</span></div>
    <div class="score-sub">맞은 개수 ${state.correct} / ${tot} · 정답률 ${ans>0?Math.round(state.correct/ans*100):0}%</div>
    ${(state.maxCombo||0)>=2?`<div class="score-sub">🔥 최고 연속 정답 ${state.maxCombo}개</div>`:''}
    <div class="gauge"><div class="mark" style="left:${gaugePos}%;"></div></div>
    <div class="gauge-labels"><span>노력 중</span><span>좋아요</span><span>완벽 마스터</span></div>
    ${fan?`<div class="fanfare ${fan.tier}">${fan.msg}</div>`:`<div class="fanfare f80">🌱 괜찮아요, 틀린 문제를 다시 보면 금방 늘어요!</div>`}
    <button class="btn btn-outline" id="wrongNoteBtn" style="margin-top:16px;">🚫 틀린 문제 오답노트 보기</button>
    <div class="row2">
      <button class="btn btn-ghost" id="backHomeBtn">처음으로</button>
      <button class="btn btn-ghost" id="retryBtn">다시 풀기</button>
    </div>
  </div>`;
}

function renderWrongNote(){
  const items=state.wrong;
  return `
  <div class="card" id="printArea">
    <h2 class="card-title">📝 오답노트 · ${state.name}</h2>
    <div style="font-size:12px;color:var(--sub);margin:-8px 0 12px;">${fmtDT(Date.now())}</div>
    ${items.length===0?'<p>이번 시험에서 틀린 문제가 없어요! 완벽해요 🎉</p>':
    items.map((w,i)=>`<div class="wrongitem"><div class="wq">${i+1}. ${w.q}</div>
      <div class="wu">내가 쓴 답: ${w.your}</div>
      <div class="wa">정답: ${w.correct}</div>
      <div style="font-size:12.5px;color:var(--sub);margin-top:4px;">${w.explain}</div></div>`).join('')}
  </div>
  <button class="btn btn-primary" id="pdfBtn">📄 오답노트 PDF 만들기 (저장·인쇄)</button>
  <div class="small-note">💡 이 오답은 구글 시트에도 함께 저장돼요. 다른 기기에서도 '오답 모드'로 다시 풀 수 있어요.</div>
  <button class="btn btn-ghost" id="backResultBtn" style="margin-top:10px;">결과로 돌아가기</button>
  `;
}

/* ============ PDF 생성/인쇄 (html2canvas + jsPDF) ============ */
let lastPdfBlobUrl=null;
let lastPdfFilename=null;
function buildPrintClone(sourceNode,title){
  const clone=document.createElement('div');
  clone.className='pdf-clone';
  clone.style.cssText='position:fixed;left:-9999px;top:0;width:760px;background:#ffffff;padding:26px 30px;font-family:"Noto Sans KR",sans-serif;box-sizing:border-box;';
  const style=document.createElement('style');
  style.textContent=`
    .pdf-clone .card-title{font-size:18px;margin:0 0 4px;color:#4834b0;font-family:Georgia,'Nanum Myeongjo','Batang',serif;}
    .pdf-clone .wrongitem{border:1px solid #e6e0f7;border-radius:8px;padding:10px 12px;margin-bottom:8px;}
    .pdf-clone .wq{font-size:12.5px;font-weight:700;margin-bottom:4px;line-height:1.45;color:#211d3a;}
    .pdf-clone .wu{font-size:11px;color:#c0392b;}
    .pdf-clone .wa{font-size:11px;color:#2e8b57;font-weight:700;}
    .pdf-clone .wrongitem > div:last-child{font-size:10.5px;color:#7a76a3;margin-top:3px;line-height:1.45;}
  `;
  clone.appendChild(style);
  const inner=document.createElement('div');
  inner.innerHTML=sourceNode.innerHTML;
  clone.appendChild(inner);
  document.body.appendChild(clone);
  return clone;
}
async function generateWrongNotePDF(filenamePrefix){
  const node=document.getElementById('printArea');
  if(!node) return;
  if(!window.html2canvas || !(window.jspdf&&window.jspdf.jsPDF)){
    await showAlert('PDF 기능을 불러오는 중이에요. 인터넷 연결을 확인한 뒤 잠시 후 다시 시도해 주세요.');
    return;
  }
  showLoading('PDF를 만들고 있어요...');
  let clone=null;
  try{
    clone=buildPrintClone(node);
    await new Promise(r=>setTimeout(r,30));
    const canvas=await html2canvas(clone,{scale:2,backgroundColor:'#ffffff',useCORS:true,windowWidth:800});
    const imgData=canvas.toDataURL('image/jpeg',0.92);
    const {jsPDF}=window.jspdf;
    const pdf=new jsPDF('p','mm','a4');
    const pdfFilename=`${safeName(filenamePrefix||state.name)||'학생'}-오답노트-${fmtDate(Date.now())}.pdf`;
    pdf.setProperties({title:pdfFilename});
    const pageWidth=pdf.internal.pageSize.getWidth();
    const pageHeight=pdf.internal.pageSize.getHeight();
    const imgWidth=pageWidth;
    const imgHeight=canvas.height*imgWidth/canvas.width;
    let heightLeft=imgHeight;
    let position=0;
    pdf.addImage(imgData,'JPEG',0,position,imgWidth,imgHeight);
    heightLeft-=pageHeight;
    while(heightLeft>0){
      position=heightLeft-imgHeight;
      pdf.addPage();
      pdf.addImage(imgData,'JPEG',0,position,imgWidth,imgHeight);
      heightLeft-=pageHeight;
    }
    if(lastPdfBlobUrl){ try{URL.revokeObjectURL(lastPdfBlobUrl);}catch(e){} }
    lastPdfBlobUrl=pdf.output('bloburl');
    lastPdfFilename=pdfFilename;
    hideLoading();
    showPdfReadyModal();
  }catch(e){
    hideLoading();
    await showAlert('PDF를 만드는 중 문제가 발생했어요. 인터넷 연결을 확인하고 다시 시도해 주세요.');
  } finally {
    if(clone && clone.parentNode) clone.parentNode.removeChild(clone);
  }
}

async function renderTeacherDashAsync(){
  const app=document.getElementById('app');
  app.innerHTML=`<div class="card"><p>불러오는 중...</p></div>`;
  if(!GAS_URL){
    app.innerHTML=`<div class="card"><h2 class="card-title">📋 강사용 결과 화면</h2><p style="color:var(--sub);font-size:13px;">⚠️ 아직 구글 시트 연동 주소가 설정되지 않았어요. 코드 상단의 <code>GAS_URL</code> 값에 배포된 Apps Script 웹앱 주소를 붙여넣어 주세요.</p><button class="btn btn-ghost" id="backHomeBtn" style="margin-top:10px;">돌아가기</button></div>`;
    document.getElementById('backHomeBtn').onclick=()=>{screen='setup';render();};
    return;
  }
  try{
    const res=await fetch(GAS_URL+'?action=all&app='+encodeURIComponent(APP_ID));
    const j=await res.json();
    if(!j || !j.ok) throw new Error('bad response');
    const students=j.students||[];
    loginConfigCache=null; // 강사가 방금 값을 바꿨을 수도 있으니 대시보드 열 때마다 최신값을 다시 받아와요.
    const cfg=await getLoginConfig();
    app.innerHTML=`
    <div class="card">
      <h2 class="card-title">📋 강사용 결과 화면</h2>
      <div class="pw-change-box">
        <div class="toggle-row" style="margin-bottom:${cfg.loginEnabled?'10px':'0'};">
          <input type="checkbox" id="loginEnabledChk" ${cfg.loginEnabled?'checked':''}>
          <label for="loginEnabledChk" style="flex:none;"><b>🔐 학생 로그인(이름+비밀번호) 사용</b></label>
        </div>
        ${cfg.loginEnabled?`
        <div style="font-size:12.5px;color:#7a5a1a;margin:4px 0 8px;">현재 비밀번호: <b>${cfg.password}</b> · 바꾸면 학생들에게 새 비밀번호를 알려주세요.</div>
        <div class="row2">
          <input type="text" inputmode="numeric" id="newPwInput" placeholder="새 비밀번호" class="kbdinput" style="margin-bottom:0;">
          <button class="btn btn-primary" id="savePwBtn" style="white-space:nowrap;">저장</button>
        </div>`:`
        <div style="font-size:12.5px;color:#7a5a1a;">꺼져 있으면 학생들은 이름만 입력하면 바로 들어갈 수 있어요(비밀번호를 묻지 않아요).</div>`}
      </div>
      <p style="font-size:13px;color:var(--sub);margin-bottom:10px;">총 ${students.length}명의 학생 기록이에요. 이름을 눌러 자세히 볼 수 있어요.</p>
      ${students.length===0?'<p>아직 제출된 기록이 없어요.</p>':
      students.map(s=>`<div class="stu-row" data-name="${s.name}">
        <div><div class="stu-name">${s.name}</div><div class="stu-meta">응시 ${s.count}회 · 최근 ${fmtDT(s.last)}</div></div>
        <div class="stu-score">${s.avg}점</div>
      </div>`).join('')}
      <button class="btn btn-outline" id="refreshBtn" style="margin-top:16px;">🔄 새로고침</button>
      <button class="btn btn-ghost" id="backHomeBtn" style="margin-top:10px;">돌아가기</button>
    </div>`;
    document.querySelectorAll('.stu-row').forEach(el=>{
      el.onclick=()=>showTeacherDetail(el.dataset.name);
    });
    document.getElementById('refreshBtn').onclick=()=>renderTeacherDashAsync();
    document.getElementById('backHomeBtn').onclick=()=>{screen='setup';render();};
    document.getElementById('loginEnabledChk').onchange=async (e)=>{
      const enabled=e.target.checked;
      showLoading('저장하고 있어요...');
      try{
        await fetch(GAS_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain'},
          body:JSON.stringify({type:'setLoginEnabled', app:APP_ID, enabled:enabled})});
        try{ localStorage.setItem(cachedLoginEnabledKey(), enabled?'Y':'N'); }catch(err){}
        loginConfigCache=null;
        hideLoading();
        renderTeacherDashAsync();
      }catch(err){
        hideLoading();
        showAlert('저장에 실패했어요. 잠시 후 다시 시도해 주세요.');
        e.target.checked=!enabled;
      }
    };
    const savePwBtn=document.getElementById('savePwBtn');
    if(savePwBtn) savePwBtn.onclick=async ()=>{
      const v=(document.getElementById('newPwInput').value||'').trim();
      if(!v){showAlert('새 비밀번호를 입력해 주세요!');return;}
      showLoading('저장하고 있어요...');
      try{
        await fetch(GAS_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain'},
          body:JSON.stringify({type:'setPassword', app:APP_ID, password:v})});
        try{ localStorage.setItem(cachedStudentPwKey(), v); }catch(e){}
        loginConfigCache=null;
        hideLoading();
        await showAlert('비밀번호가 바뀌었어요! 학생들에게 새 비밀번호("'+v+'")를 알려주세요.');
        renderTeacherDashAsync();
      }catch(e){
        hideLoading();
        showAlert('저장에 실패했어요. 잠시 후 다시 시도해 주세요.');
      }
    };
  }catch(e){
    app.innerHTML=`<div class="card"><h2 class="card-title">📋 강사용 결과 화면</h2><p style="color:#c0392b;">구글 시트를 불러오지 못했어요. Apps Script 배포 주소(GAS_URL)와 배포 설정("액세스 권한: 모든 사용자")을 확인한 뒤 새로고침해 주세요.</p><button class="btn btn-outline" id="retryDashBtn" style="margin-top:10px;">🔄 다시 시도</button><button class="btn btn-ghost" id="backHomeBtn" style="margin-top:10px;">돌아가기</button></div>`;
    document.getElementById('retryDashBtn').onclick=()=>renderTeacherDashAsync();
    document.getElementById('backHomeBtn').onclick=()=>{screen='setup';render();};
  }
}

async function showTeacherDetail(name){
  const app=document.getElementById('app');
  app.innerHTML=`<div class="card"><p>불러오는 중...</p></div>`;
  const {ok, sessions}=await fetchStudentSessions(name);
  if(!ok){
    app.innerHTML=`<div class="card"><p>학생 기록을 불러오지 못했어요.</p><button class="btn btn-ghost" id="backDashBtn" style="margin-top:10px;">목록으로</button></div>`;
    document.getElementById('backDashBtn').onclick=()=>{screen='tdash';render();renderTeacherDashAsync();};
    return;
  }
  const sorted=sessions.slice().sort((a,b)=>b.ts-a.ts);
  const latest=sorted[0];
  // 시간순으로 훑으면서, 같은 문제를 나중에 맞혔다면 오답 목록에서 빼고, 아직 틀린 채로
  // 남아있는 문제에는 '마지막으로 틀린 날짜'를 함께 기록해요(강사가 언제 틀렸는지 알 수 있게).
  const byTimeAsc=sorted.slice().sort((a,b)=>a.ts-b.ts);
  const wrongMap={};
  byTimeAsc.forEach(s=>{
    const wrongIds=new Set((s.wrong||[]).map(w=>w.id));
    (s.wrong||[]).forEach(w=>{ wrongMap[w.id]={...w, lastWrongTs:s.ts}; });
    const answers=s.answers||{};
    Object.keys(answers).forEach(qid=>{
      if(answers[qid]===true && !wrongIds.has(qid)) delete wrongMap[qid];
    });
  });
  const allWrong=Object.values(wrongMap).sort((a,b)=>(b.lastWrongTs||0)-(a.lastWrongTs||0));
  app.innerHTML=`
  <div class="card" id="printArea">
    <h2 class="card-title">📋 ${name}님의 기록</h2>
    <p style="font-size:13px;color:var(--sub);">총 ${sorted.length}회 응시 · 최근 점수 ${latest?latest.score:'-'}점 (${latest?fmtDT(latest.ts):''})</p>
    <table style="margin:10px 0 16px;">
      <tr><th>일시</th><th>모드</th><th>점수</th><th>맞음/전체</th></tr>
      ${sorted.map(s=>`<tr><td>${fmtDT(s.ts)}</td><td>${modeLabel(s.mode)}</td><td>${s.score}점</td><td>${s.correct}/${s.total}</td></tr>`).join('')}
    </table>
    <h2 class="card-title" style="font-size:16px;">🚫 누적 오답 (${allWrong.length}개)</h2>
    <div style="font-size:12px;color:var(--sub);margin:-6px 0 10px;">${name} · 이 화면을 보는 시각: ${fmtDT(Date.now())}</div>
    ${allWrong.length===0?'<p>틀린 문제가 없어요! 완벽해요 🎉</p>':
    allWrong.map((w,i)=>`<div class="wrongitem"><div class="wq">${i+1}. ${w.q}</div>
      <div class="wu">학생이 쓴 답: ${w.your}</div>
      <div class="wa">정답: ${w.correct}</div>
      <div class="wu" style="color:var(--sub);">마지막으로 틀린 날짜: ${w.lastWrongTs?fmtDT(w.lastWrongTs):'-'}</div></div>`).join('')}
  </div>
  <div class="row2">
    <button class="btn btn-primary" id="printDetailBtn">🖨️ 인쇄하기</button>
    <button class="btn btn-outline" id="pdfDetailBtn">💾 PDF로 저장</button>
  </div>
  <button class="btn btn-ghost" id="backDashBtn" style="margin-top:10px;">목록으로</button>
  `;
  document.getElementById('printDetailBtn').onclick=()=>printNow();
  document.getElementById('pdfDetailBtn').onclick=()=>generateWrongNotePDF(name+'-강사용');
  document.getElementById('backDashBtn').onclick=()=>{screen='tdash';render();renderTeacherDashAsync();};
}

/* ============ EVENT BINDING ============ */
function bindEvents(){
  if(screen==='login'){
    document.getElementById('loginBtn').onclick=()=>{attemptLogin();};
    const pwEl=document.getElementById('loginPwInput');
    if(pwEl) pwEl.onkeydown=(e)=>{ if(e.key==='Enter') attemptLogin(); };
    const nmEl=document.getElementById('loginNameInput');
    if(nmEl) nmEl.onkeydown=(e)=>{ if(e.key==='Enter') document.getElementById('loginPwInput').focus(); };
    return;
  }
  if(screen==='setup'){
    function resolvedResumeSnapshot(group){
      const local=loadResumeSnapshot(state.name, group==='wrong'?'wrong':'full');
      const server=serverResumeCache[group==='wrong'?'wrong':'normal'];
      return pickNewerSnapshot(local, server);
    }
    document.querySelectorAll('.resumeBtn').forEach(btn=>{
      btn.onclick=()=>{
        const snap=resolvedResumeSnapshot(btn.dataset.group);
        if(snap) resumeFromSnapshot(snap);
      };
    });
    document.querySelectorAll('.discardResumeBtn').forEach(btn=>{
      btn.onclick=()=>{
        const group=btn.dataset.group;
        clearResumeSnapshot(state.name, group==='wrong'?'wrong':'full');
        if(group==='wrong') serverResumeCache.wrong=null; else serverResumeCache.normal=null;
        render();
      };
    });
    document.querySelectorAll('.finalizeResumeBtn').forEach(btn=>{
      btn.onclick=()=>{
        const snap=resolvedResumeSnapshot(btn.dataset.group);
        if(!snap) return;
        resumeFromSnapshot(snap);
        giveUp();
      };
    });
    document.querySelectorAll('.chip').forEach(c=>{
      c.onclick=()=>{
        const id=c.dataset.cat;
        if(state.cats.includes(id)) state.cats=state.cats.filter(x=>x!==id);
        else state.cats.push(id);
        if(state.randomCount>0){
          const poolLen=pickByCats(state.cats).length;
          state.randomCount=Math.min(state.randomCount,poolLen)||1;
        }
        render();
      };
    });
    document.getElementById('shuffleChk').onchange=(e)=>{state.order=e.target.checked?'shuffle':'seq';};
    document.getElementById('randomCountChk').onchange=(e)=>{
      if(e.target.checked){
        const poolLen=pickByCats(state.cats).length;
        state.randomCount=Math.min(20,poolLen)||1;
      } else {
        state.randomCount=0;
      }
      render();
    };
    const rcInput=document.getElementById('randomCountInput');
    if(rcInput) rcInput.onchange=(e)=>{
      const poolLen=pickByCats(state.cats).length;
      let v=parseInt(e.target.value,10)||1;
      v=Math.max(1,Math.min(v,poolLen)); // 고른 범위의 총 문제 수를 넘지 않도록 여기서 한 번 더 막아요.
      state.randomCount=v;
      render();
    };
    document.querySelectorAll('.mode-card').forEach(m=>{
      m.onclick=(e)=>{
        if(e.target.closest('.scope-chip')) return;
        state.mode=m.dataset.mode;render();
      };
    });
    document.querySelectorAll('.scope-chip').forEach(c=>{
      c.onclick=(e)=>{e.stopPropagation();state.wrongScope=c.dataset.scope;render();};
    });
    document.getElementById('startBtn').onclick=()=>{startQuiz(state.mode);};
    document.getElementById('teacherBtn').onclick=()=>{screen='tlogin';render();};
    document.getElementById('logoutBtn').onclick=async ()=>{
      const ok=await showConfirm('다른 사람으로 로그인할까요? (지금 이름은 로그아웃돼요)');
      if(!ok) return;
      state.name='';
      screen='login'; render();
    };
    document.getElementById('storageTestBtn').onclick=()=>{
      const testKey='storagetest_'+APP_KEY;
      const ok1=sset(testKey,{ping:Date.now()});
      const ok2=ok1 && sget(testKey);
      showAlert(ok1&&ok2?'✅ 이 기기의 저장 기능이 정상 작동해요! (이어풀기에 사용돼요)':'❌ 이 기기에서 저장 기능을 사용할 수 없어요. 시크릿 모드이거나 저장 공간이 부족할 수 있어요.');
    };
  }
  else if(screen==='quiz'){
    if(!state.submitted){
      document.querySelectorAll('.choice').forEach(c=>{
        c.onclick=()=>{
          if(state.mode==='deep' && Date.now()<state.lockUntil){return;}
          state.selected=parseInt(c.dataset.idx);render();
        };
      });
      const curQ=currentQ();
      document.querySelectorAll('.block-tile').forEach(t=>{
        t.onclick=()=>{
          if(state.mode==='deep' && Date.now()<state.lockUntil){return;}
          const idx=parseInt(t.dataset.bidx);
          if(state.blockPicks.includes(idx)) return; // 이미 쓴 타일
          if(curQ && state.blockPicks.length>=curQ.answer.length) return; // 다 채웠으면 더 못 누름
          state.blockPicks.push(idx); render();
        };
      });
      const undoBtn=document.getElementById('blockUndoBtn');
      if(undoBtn) undoBtn.onclick=()=>{ state.blockPicks.pop(); render(); };
      document.querySelectorAll('.pt-tile').forEach(t=>{
        t.onclick=()=>{
          if(state.mode==='deep' && Date.now()<state.lockUntil){return;}
          const idx=parseInt(t.dataset.pfidx);
          if(state.pfUsed.includes(idx)) return; // 이미 쓴 타일
          const expected=curQ.order[state.pfProgress];
          if(curQ.palette[idx]===expected){
            state.pfUsed.push(idx);
            state.pfProgress++;
            if(state.pfProgress>=curQ.order.length){ handleSubmit(false); return; }
            render();
          } else {
            state.pfMistakes++;
            t.classList.add('shake');
            setTimeout(()=>t.classList.remove('shake'),320);
          }
        };
      });
      const sb=document.getElementById('submitBtn');
      if(sb) sb.onclick=async()=>{
        if(state.mode==='deep' && Date.now()<state.lockUntil){showAlert('아직 5초가 지나지 않았어요!');return;}
        const isBlocks=curQ && curQ.t==='blocks';
        const incomplete=isBlocks ? state.blockPicks.length<curQ.answer.length : (state.selected===null || state.selected===undefined);
        if(incomplete){
          const ok=await showConfirm(isBlocks?'아직 다 채우지 않았어요. 그래도 제출할까요?':'답을 선택하지 않았어요. 그래도 제출할까요?');
          if(!ok){return;}
        }
        handleSubmit(false);
      };
    } else {
      document.getElementById('nextBtn').onclick=()=>goNext();
    }
    document.getElementById('giveupBtn').onclick=()=>handleGiveUpTap();
  }
  else if(screen==='setresult'){
    document.getElementById('nextSetBtn').onclick=()=>{render();startTimerForCurrent();};
    document.getElementById('giveupSetBtn').onclick=()=>handleGiveUpTap();
  }
  else if(screen==='result'){
    document.getElementById('wrongNoteBtn').onclick=()=>{screen='wrongnote';render();};
    document.getElementById('backHomeBtn').onclick=()=>{const nm=state.name;state=newSession();state.name=nm;screen='setup';render();};
    document.getElementById('retryBtn').onclick=()=>{const nm=state.name;const cats=state.cats;const ord=state.order;const md=state.mode;state=newSession();state.name=nm;state.cats=cats;state.order=ord;state.mode=md;screen='setup';render();};
  }
  else if(screen==='wrongnote'){
    document.getElementById('pdfBtn').onclick=()=>generateWrongNotePDF();
    document.getElementById('backResultBtn').onclick=()=>{screen='result';render();};
  }
  else if(screen==='tlogin'){
    document.getElementById('pwSubmit').onclick=()=>{
      const v=document.getElementById('pwInput').value;
      if(v===TEACHER_PW){screen='tdash';render();renderTeacherDashAsync();}
      else showAlert('비밀번호가 틀렸어요.');
    };
    document.getElementById('pwCancel').onclick=()=>{screen='setup';render();};
  }
}
